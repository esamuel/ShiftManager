<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShiftManager AI Support</title>
  <style>
    :root {
      --primary: #5856D6;
      --secondary: #34C759;
      --gradient: linear-gradient(135deg, #5856D6 0%, #34C759 100%);
      --bg: #F2F2F7;
    }

    body {
      font-family: -apple-system, system-ui, sans-serif;
      background: var(--bg);
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }

    header {
      background: var(--gradient);
      color: white;
      width: 100%;
      padding: 1.5rem;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .container {
      max-width: 600px;
      width: 90%;
      margin-top: 2rem;
      background: white;
      padding: 2rem;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
    }

    select {
      padding: 10px;
      font-size: 1rem;
      border-radius: 10px;
      border: 1px solid #ccc;
      margin: 1rem 0;
      width: 100%;
    }

    #start-btn {
      background: var(--gradient);
      border: none;
      color: white;
      padding: 1rem 2rem;
      font-size: 1.2rem;
      border-radius: 50px;
      cursor: pointer;
      width: 100%;
      margin-top: 1rem;
      transition: transform 0.2s;
      box-shadow: 0 4px 15px rgba(88, 86, 214, 0.3);
    }

    #start-btn:active {
      transform: scale(0.95);
    }

    #start-btn.listening {
      background: #FF3B30;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.4);
      }

      70% {
        box-shadow: 0 0 0 15px rgba(255, 59, 48, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(255, 59, 48, 0);
      }
    }

    .status {
      color: #666;
      margin: 1rem 0;
      min-height: 1.5rem;
      font-style: italic;
    }

    .prompt {
      font-weight: bold;
      color: var(--primary);
      min-height: 1.5rem;
      margin-bottom: 1rem;
    }

    .response-card {
      background: #F9F9F9;
      border-left: 5px solid var(--secondary);
      padding: 1rem;
      text-align: left;
      margin-top: 2rem;
      border-radius: 8px;
      display: flex;
      gap: 1rem;
      align-items: start;
    }

    .response-card.hidden {
      display: none;
    }

    .flag {
      font-size: 2rem;
    }

    .text {
      flex: 1;
      font-size: 1.1rem;
      line-height: 1.5;
    }

    .back-link {
      margin-top: 2rem;
      color: #888;
      text-decoration: none;
      display: block;
    }
  </style>
</head>

<body>

  <header>
    <h1>AI Support Agent</h1>
    <p>Voice-Powered Assistance</p>
  </header>

  <div class="container">

    <label for="lang-select">I speak:</label>
    <select id="lang-select">
      <option value="en-US">English 🇺🇸</option>
      <option value="he-IL">Hebrew 🇮🇱</option>
      <option value="es-ES">Spanish 🇪🇸</option>
      <option value="fr-FR">French 🇫🇷</option>
      <option value="ru-RU">Russian 🇷🇺</option>
      <option value="de-DE">German 🇩🇪</option>
    </select>

    <label for="voice-select">Narrator Voice:</label>
    <select id="voice-select">
      <option value="auto">Auto (Best Available)</option>
      <!-- Voices will be populated dynamically -->
    </select>

    <div id="prompt-text" class="prompt"></div>
    <div id="status-text" class="status">Tap Start to speak...</div>

    <button id="start-btn">Start Speaking</button>

    <div id="response-card" class="response-card hidden">
      <div id="response-flag" class="flag">🇺🇸</div>
      <div id="response-text" class="text"></div>
    </div>

    <a href="../index.html" class="back-link">← Back to Website</a>
  </div>

  <!-- Load the Cache and FAQ System -->
  <script src="cache.js"></script>

  <!-- Load the Application Logic -->
  <script src="app.js"></script>
</body>

</html>
